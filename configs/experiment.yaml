# Cấu hình tổng thể thí nghiệm: YOLO + ByteTrack + GA + Fuzzy
experiment_name: "mot17_fuzzy_bytetrack_study"
project_root: "."

# 1. Dataset & Splits
dataset:
  name: "MOT17"
  root_dir: "data/MOT17"
  splits_file: "configs/splits.yaml"
  primary_detector_suffix: "FRCNN"

# 2. Detector (Pretrained YOLO - Frozen, Zero Fine-Tuning)
detector:
  model_name: "yolov8n.pt" # Hoặc yolo11n.pt
  imgsz: 1280
  conf: 0.01 # Giữ ngưỡng thấp để phục vụ lượt ghép thứ 2 của ByteTrack
  iou: 0.7 # Ngưỡng NMS IoU
  device: "auto" # "auto", "cpu", hoặc "0"
  classes: [0] # Class 0: Pedestrian trong pretrained COCO
  half: false # Dùng FP16 nếu CUDA khả dụng

# 3. Detection Cache (Tối ưu cho RTX 3050 - Chạy detector 1 lần duy nhất)
cache:
  enabled: true
  cache_dir: "data/cache/detections"
  format: "npz" # Nén nhanh, chính xác

# 4. Cấu hình ByteTrack mặc định (Baseline)
bytetrack:
  tracker_type: "bytetrack"
  track_high_thresh: 0.25
  track_low_thresh: 0.10
  new_track_thresh: 0.25
  track_buffer: 30
  match_thresh: 0.80
  fuse_score: true

# 5. Cấu hình Fuzzy Adaptive Controller (Điều chỉnh track_high_thresh động)
fuzzy:
  enabled: true
  delta_high_thresh_limit: 0.10
  track_high_thresh_min: 0.15
  track_high_thresh_max: 0.45
  use_prior_unmatched: true # Dùng unmatched_ratio từ frame trước để tránh vòng lặp phụ thuộc

# 6. Cấu hình Genetic Algorithm (Chỉ tối ưu trên Development Split)
ga:
  population_size: 10
  generations: 8
  crossover_rate: 0.8
  mutation_rate: 0.2
  elitism: 2
  seeds: [42, 43, 44]
  param_ranges:
    track_high_thresh: [0.15, 0.45]
    match_thresh: [0.60, 0.90]

# 7. Cấu hình Logs và Kết quả đầu ra
outputs:
  results_dir: "outputs/experiments"
  save_annotated_video: false

